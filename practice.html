<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика — DRIVE READY UA</title><style>body{background:#101714;color:#eef5ef;font:18px system-ui;margin:0}main{max-width:800px;margin:auto;padding:24px}button,select{font:inherit;background:#20372b;color:white;border:1px solid #53745d;border-radius:12px;padding:14px;margin:6px;cursor:pointer}a,h1{color:#83f4ad}article{background:#1b2922;padding:20px;border-radius:18px;margin:14px 0}button:disabled{opacity:.6}label{display:block}progress{width:100%;accent-color:#83f4ad}</style><main><a href="index.html">← Головна</a><h1>Майстерня водіння</h1><p>Навчальні ситуації для категорії B. Не симуляція конкретного офіційного маршруту.</p><article><h2>Голосовий екзаменатор</h2><progress id="progress" max="8" value="0"></progress><h3 id="q"></h3><button id="voice">🔊 Прослухати команду</button><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Наступна ситуація</button></article><article><h2>Чекліст перед поїздкою</h2><div id="checks"></div><p id="total"></p></article><article><h2>Щоденник помилок</h2><p>Зберігається лише у цьому браузері.</p><div id="history"></div><button id="clear">Очистити щоденник</button></article></main><script>const bank=[['Почніть рух від краю проїзної частини.',['Покажчик, дзеркала, перевірка сліпої зони та надання дороги','Одразу рушити'],0,'Переконайтеся у безпеці маневру та дайте дорогу.'],['На наступному перехресті поверніть праворуч.',['Повернути з будь-якої смуги','Завчасно обрати дозволене положення, подати сигнал і дати дорогу тим, хто має перевагу'],1,'Враховуйте знаки, розмітку, пішоходів і велосипедистів.'],['Перед вами знак STOP.',['Повністю зупинитися перед стоп-лінією, а за її відсутності — у визначеному ПДР місці','Лише пригальмувати'],0,'Знак вимагає повної зупинки.'],['Виконайте перестроювання ліворуч.',['Подати сигнал і негайно перестроїтися','Перевірити дзеркала, сліпу зону, подати сигнал та дати дорогу'],1,'Сигнал не надає переваги.'],['На нерегульованому переході є пішохід.',['Дати дорогу, за потреби зупинитися','Продовжити рух без зміни швидкості'],0,'Пішохід має отримати можливість безпечно перейти.'],['Виконайте розворот, де це дозволено.',['Розвернутися негайно','Перевірити заборони, видимість, розмітку та перевагу інших учасників'],1,'Команда не скасовує вимог ПДР.'],['Екзаменатор просить зупинитися.',['Знайти дозволене безпечне місце, подати сигнал і плавно зупинитися','Зупинитися негайно незалежно від знаків'],0,'Зупинка має відповідати ПДР.'],['Завершіть поїздку.',['Відчинити двері не дивлячись','Зафіксувати автомобіль і переконатися в безпеці виходу'],1,'Не створюйте небезпеки при відкриванні дверей.']];let i=0,score=0;const e=id=>document.getElementById(id);let mistakes=[];try{mistakes=JSON.parse(localStorage.getItem('drive-errors')||'[]')}catch{}function history(){e('history').replaceChildren(...mistakes.map(t=>{const p=document.createElement('p');p.textContent=t;return p}))}function show(){e('progress').value=i;e('options').replaceChildren();e('feedback').textContent='';e('next').hidden=true;if(i===bank.length){e('q').textContent='Результат: '+score+' із '+bank.length;e('voice').hidden=true;e('next').textContent='Повторити';e('next').hidden=false;return}e('voice').hidden=false;const q=bank[i];e('q').textContent=q[0];q[1].forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(j===q[2])score++;else{mistakes.push(q[0]+' '+q[3]);try{localStorage.setItem('drive-errors',JSON.stringify(mistakes))}catch{}history()}e('feedback').textContent=(j===q[2]?'Правильно. ':'Помилка. ')+q[3];for(const x of e('options').children)x.disabled=true;e('next').hidden=false};e('options').append(b)})}e('next').onclick=()=>{if(i===bank.length){i=0;score=0;e('next').textContent='Наступна ситуація'}else i++;show()};e('voice').onclick=()=>{if(!window.speechSynthesis){e('feedback').textContent='Озвучення не підтримується браузером.';return}const u=new SpeechSynthesisUtterance(bank[i][0]);u.lang='uk-UA';const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('uk'));if(!v){e('feedback').textContent='Український голос недоступний на цьому пристрої.';return}u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)};const checks=['Відрегульовано сидіння','Відрегульовано дзеркала','Пристебнуто ремінь','Перевірено положення органів керування','Перевірено дорожню обстановку'];for(const t of checks){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.onchange=()=>e('total').textContent='Виконано '+document.querySelectorAll('#checks input:checked').length+' із '+checks.length;l.append(c,t);e('checks').append(l)}e('clear').onclick=()=>{mistakes=[];try{localStorage.removeItem('drive-errors')}catch{}history()};history();show()</script>
