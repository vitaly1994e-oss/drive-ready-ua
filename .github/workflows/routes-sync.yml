name: Оновлення маршрутів МВС
# Доступ ГСЦ МВС із GitHub Actions повертає 403: залишено лише ручний запуск.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Отримати публічні схеми з ГСЦ МВС
        run: python scripts/sync_routes.py
      - name: Опублікувати каталог тільки якщо дані змінилися
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Оновлено офіційні схеми маршрутів МВС"
            git push
          fi
