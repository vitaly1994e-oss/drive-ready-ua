name: Booking platform tests
on:
  pull_request:
    paths:
      - 'booking/**'
      - 'render-booking.yaml'
      - '.github/workflows/booking-check.yml'
  push:
    branches: [main]
    paths:
      - 'booking/**'
      - 'render-booking.yaml'
      - '.github/workflows/booking-check.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_ci
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: booking
    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_ci
      ADMIN_PASSWORD: test-admin-password-123456
      SESSION_SECRET: test-secret-that-is-at-least-thirty-two-bytes-long-98765
      PORT: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --check server.js && node --check public/app.js && node --check public/admin.js
      - run: npm test
      - name: Start server and test booking transaction
        run: |
          node server.js > /tmp/drive-time-booking.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/health
          node --test integration.mjs
      - name: Mobile and desktop visual verification
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          node visual.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-visual
          path: /tmp/drive-time-*.png
          if-no-files-found: ignore
      - name: Diagnostics on failure
        if: failure()
        run: tail -100 /tmp/drive-time-booking.log || true
