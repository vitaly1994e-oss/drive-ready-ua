name: Збір схем Харківщини
on:
  push:
    branches: [kharkiv-all-routes-2026-11-27]
    paths:
      - scripts/sync_kharkiv.py
      - .github/workflows/kharkiv-routes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Перевірені схеми Харківщини із відкритого джерела
        run: python scripts/sync_kharkiv.py
      - name: Зберегти реальні маршрути
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kharkiv-schemes.js
          if ! git diff --cached --quiet; then
            git commit -m "Маршрути Харківщини з опублікованих схем"
            git push
          fi
