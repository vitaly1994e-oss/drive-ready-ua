# Standalone DRIVE TIME lesson booking web service.
# Uses the existing dedicated Render Postgres database, which is NOT managed here.
# The two app secrets are generated by Render and never committed to GitHub.
services:
  - type: web
    name: drive-time-booking
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/vitaly1994e-oss/drive-ready-ua
    branch: main
    rootDir: booking
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drive-ready-bookings-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
