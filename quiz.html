<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренажер ПДР — DRIVE READY UA</title><style>body{background:#101714;color:#eef5ef;font:18px system-ui;margin:0}main{max-width:720px;margin:auto;padding:24px}button{display:block;width:100%;text-align:left;padding:16px;margin:12px 0;border:1px solid #476052;border-radius:12px;background:#1b2922;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.7}a{color:#83f4ad}h1{color:#83f4ad}#feedback{line-height:1.6}progress{width:100%;accent-color:#83f4ad}</style><main><a href="index.html">← Головна</a><h1>Тренажер ПДР</h1><p>Авторські навчальні запитання, не офіційний екзаменаційний банк.</p><progress id="bar" max="6" value="0"></progress><p id="count"></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Далі</button></main><script>const bank=[['Що означає червоний сигнал світлофора?',['Рух заборонено','Рух дозволено','Потрібно прискоритися'],0,'Червоний сигнал забороняє рух. Враховуйте окремі дозволені правилами сигнали та секції.'],['Чи потрібно подавати сигнал перед перестроюванням?',['Ні','Так'],1,'Перед перестроюванням потрібно завчасно подати відповідний сигнал.'],['Чи дає увімкнений покажчик повороту перевагу?',['Так','Ні'],1,'Подавання сигналу не дає переваги та не звільняє від запобіжних заходів.'],['Яка загальна максимальна швидкість у населеному пункті за відсутності інших обмежень?',['50 км/год','90 км/год','110 км/год'],0,'Загальне обмеження — 50 км/год. Враховуйте дорожні знаки та умови руху.'],['Що робити перед нерегульованим пішохідним переходом, на якому є пішоходи?',['Прискоритися','Зменшити швидкість, а за потреби зупинитися, щоб дати дорогу','Подати звуковий сигнал і продовжити рух'],1,'Водій повинен дати дорогу пішоходам на переході.'],['Чи дозволено тримати телефон у руці під час руху для розмови?',['Так','Ні'],1,'Під час руху користуватися засобами зв’язку, тримаючи їх у руці, заборонено, крім передбачених ПДР винятків.']];let i=0,score=0;const el=x=>document.getElementById(x);function show(){el('bar').value=i;el('count').textContent='Запитання '+(i+1)+' із '+bank.length;el('feedback').textContent='';el('next').hidden=true;el('answers').replaceChildren();if(i===bank.length){el('count').textContent='Тренування завершено';el('question').textContent='Правильних відповідей: '+score+' із '+bank.length;el('next').textContent='Повторити';el('next').hidden=false;return}const q=bank[i];el('question').textContent=q[0];q[1].forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(j===q[2])score++;el('feedback').textContent=(j===q[2]?'Правильно! ':'Помилка. ')+q[3];for(const x of el('answers').children)x.disabled=true;el('next').hidden=false};el('answers').append(b)})}el('next').onclick=()=>{if(i===bank.length){i=0;score=0;el('next').textContent='Далі'}else i++;show()};show()</script></html>
