<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Інтерактивний чекліст підготовки до практичного іспиту з водіння"><title>Чекліст практичного іспиту — Drive Ready UA</title><style>*{box-sizing:border-box}body{margin:0;background:#101714;color:#eef5ef;font:17px system-ui}main{max-width:800px;margin:auto;padding:24px}a,h1{color:#83f4ad}section{background:#1b2922;border-radius:18px;padding:20px;margin:16px 0}label{display:flex;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #34463b}input{accent-color:#83f4ad;width:20px;height:20px;flex:none}button{font:inherit;padding:12px;border:0;border-radius:10px;background:#83f4ad;color:#102017;margin:8px 8px 8px 0}progress{width:100%;accent-color:#83f4ad}@media print{body,section{background:white;color:black}a,h1{color:black}button{display:none}}</style></head><body><main><a href="index.html">← Головна</a><h1>Готовність до практичного іспиту</h1><p>Навчальний чекліст категорії B. Не є офіційним екзаменаційним листом. Використовуйте до або після поїздки, не під час керування.</p><progress id="bar"></progress><p id="score" aria-live="polite"></p><div id="items"></div><button id="reset">Скинути прогрес</button><button id="print">Роздрукувати</button><p><a href="practice.html">Практичний тренажер</a> · <a href="quiz.html">Теорія</a> · <a href="https://zakon.rada.gov.ua/laws/show/1306-2001-%D0%BF#Text">Правила дорожнього руху</a></p></main><script>const groups={'Перед початком руху':['Відрегулювати сидіння та дзеркала','Пристебнути ремінь безпеки','Перевірити дорожню обстановку та сліпі зони','Подати сигнал і надати дорогу перед початком руху'],'Під час руху':['Дотримуватися дозволеної швидкості та безпечної дистанції','Завчасно обирати дозволену смугу','Подавати сигнали перед маневрами','Враховувати знаки, розмітку та сигнали світлофорів','Надавати дорогу учасникам руху, які мають перевагу','Не виконувати команду, якщо маневр заборонений або небезпечний'],'Завершення поїздки':['Обрати дозволене місце зупинки','Подати сигнал та безпечно зупинитися','Зафіксувати автомобіль від самовільного руху','Перевірити безпеку перед відкриванням дверей']};const root=document.getElementById('items');let saved=[];try{saved=JSON.parse(localStorage.getItem('drive-checklist-v1')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let n=0;for(const [title,items] of Object.entries(groups)){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=title;s.append(h);for(const t of items){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!saved[n++];c.onchange=refresh;l.append(c,t);s.append(l)}root.append(s)}function refresh(){const values=Array.from(root.querySelectorAll('input'),c=>c.checked);const count=values.filter(Boolean).length;document.getElementById('bar').max=values.length;document.getElementById('bar').value=count;document.getElementById('score').textContent='Відпрацьовано '+count+' із '+values.length+' навичок. Це самооцінка, а не прогноз результату іспиту.';try{localStorage.setItem('drive-checklist-v1',JSON.stringify(values))}catch{}}document.getElementById('reset').onclick=()=>{root.querySelectorAll('input').forEach(c=>c.checked=false);refresh()};document.getElementById('print').onclick=()=>window.print();refresh()</script></body></html>
